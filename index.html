<!DOCTYPE html>
<html>
<head>
<title>Exam Scheduling</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Smart Exam Hall Scheduling using Greedy Graph Coloring</h1>

<label>No. of Exams</label>
<input id="examCount" type="number">

<button onclick="createInputs()">
Generate Exam Inputs
</button>

<div id="examInputs"></div>

<label>Conflicts</label>

<p>
Enter pairs like:
0 1
0 2
1 3
</p>

<textarea id="conflicts"></textarea>

<br>

<button onclick="drawGraph()">
Generate Schedule
</button>

<div id="graph"></div>

<div id="slots"></div>

<div id="legend">

<h3>Legend</h3>

🔴 Slot 1

🔵 Slot 2

🟢 Slot 3

🟠 Slot 4

🟣 Slot 5

</div>

</div>

<script src="script.js"></script>
<!-- redeploy -->
</body>
</html>
